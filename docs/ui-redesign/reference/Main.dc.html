<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>ExcaliNote – Notiz</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1194px; height: 834px; display: flex; background: #F7F3EA; color: #26223A; font-family: 'Inter', system-ui, sans-serif; overflow: hidden">

  <!-- Notizbuch-Leiste -->
  <nav aria-label="Notizbücher" style="width: 84px; flex-shrink: 0; background: #EFE9DC; border-right: 1px solid #E0D8C6; display: flex; flex-direction: column; align-items: center; padding: 16px 0; box-sizing: border-box; gap: 6px">
    <div style="width: 48px; height: 48px; border-radius: 14px; background: {{accent}}; display: flex; align-items: center; justify-content: center; margin-bottom: 10px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"></rect><path d="M9 3v18"></path><path d="M13 8h3M13 12h3"></path></svg>
    </div>
    <sc-for list="{{books}}" as="b" hint-placeholder-count="5">
      <button type="button" aria-label="{{b.name}}" style="width: 68px; border: none; border-radius: 18px; padding: 8px 0 7px; background: {{b.bg}}; box-shadow: {{b.shadow}}; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; color: #26223A">
        <span style="width: 44px; height: 44px; border-radius: 13px; background: {{b.color}}; color: #FFFFFF; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center">{{b.short}}</span>
        <span style="font-size: 11px; font-weight: 500">{{b.name}}</span>
      </button>
    </sc-for>
    <button type="button" aria-label="Neues Notizbuch" style="width: 48px; height: 48px; border: 1.5px dashed #8A8398; border-radius: 14px; background: transparent; color: #4F4A63; display: flex; align-items: center; justify-content: center; margin-top: 4px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
    <div style="flex: 1"></div>
    <button type="button" aria-label="Einstellungen" style="width: 56px; border: none; border-radius: 14px; background: transparent; padding: 6px 0; color: #26223A; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>
      <span style="font-size: 11px; font-weight: 500">Optionen</span>
    </button>
  </nav>

  <!-- Seitenliste -->
  <section aria-label="Seiten in Physik" style="width: 300px; flex-shrink: 0; background: #F7F3EA; border-right: 1px solid #E0D8C6; display: flex; flex-direction: column; padding: 20px 16px 16px; box-sizing: border-box; gap: 14px">
    <div>
      <h1 style="margin: 0; font-family: 'Caveat', cursive; font-weight: 700; font-size: 38px; line-height: 1; color: #26223A">Physik</h1>
      <p style="margin: 4px 0 0; font-size: 13px; color: #5F5A73">12 Seiten · lokal gespeichert</p>
    </div>
    <div style="position: relative">
      <label for="suche" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Seiten durchsuchen</label>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F5A73" stroke-width="1.9" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 14px; top: 13px"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.2-4.2"></path></svg>
      <input id="suche" type="search" placeholder="Seiten durchsuchen" style="width: 100%; height: 44px; box-sizing: border-box; border: 1px solid #DDD5C3; border-radius: 12px; background: #FFFEFB; padding: 0 12px 0 40px; font-family: inherit; font-size: 15px; color: #26223A">
    </div>
    <button type="button" style="height: 48px; border: none; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Neue Seite
    </button>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden">
      <sc-for list="{{pages}}" as="p" hint-placeholder-count="6">
        <li>
          <button type="button" style="width: 100%; border: 1px solid {{p.border}}; border-radius: 14px; background: {{p.bg}}; box-shadow: {{p.shadow}}; padding: 10px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; color: #26223A">
            <span style="width: 56px; height: 44px; flex-shrink: 0; border-radius: 8px; background: #FFFEFB; border: 1px solid #E3DCCB; display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 0 8px; box-sizing: border-box">
              <span style="height: 3px; border-radius: 2px; background: #B9B1C9; width: 70%"></span>
              <span style="height: 3px; border-radius: 2px; background: #D6CFE2; width: 90%"></span>
              <span style="height: 3px; border-radius: 2px; background: #D6CFE2; width: 50%"></span>
            </span>
            <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.title}}</span>
              <span style="font-size: 13px; color: #5F5A73">{{p.date}}</span>
            </span>
          </button>
        </li>
      </sc-for>
    </ul>
  </section>

  <!-- Zeichenbereich -->
  <main style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: #FFFEFB">
    <header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 14px; border-bottom: 1px solid #E6DFD0; box-sizing: border-box">
      <button type="button" aria-label="Seitenliste ein- oder ausblenden" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: transparent; color: #26223A; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M9 4v16"></path></svg>
      </button>
      <label for="titel" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Seitentitel</label>
      <input id="titel" type="text" value="Schiefe Ebene" style="flex: 1; min-width: 0; height: 44px; border: none; background: transparent; font-family: 'Caveat', cursive; font-weight: 700; font-size: 30px; color: #26223A; padding: 0 8px">
      <button type="button" aria-label="Rückgängig" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: transparent; color: #26223A; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>
      </button>
      <button type="button" aria-label="Wiederholen" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: transparent; color: #26223A; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"></path><path d="M20 9H10a6 6 0 0 0 0 12h3"></path></svg>
      </button>
      <div style="width: 1px; height: 24px; background: #E0D8C6; margin: 0 4px"></div>
      <button type="button" aria-label="Lokal gespeichert, Synchronisation aus" style="height: 44px; border: 1px solid #DDD5C3; border-radius: 22px; background: #FFFEFB; padding: 0 14px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #26223A; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M7.6 7.6A5.5 5.5 0 0 0 7 18h10.5"></path><path d="M10.8 5.3A5.5 5.5 0 0 1 17.4 9.4 4 4 0 0 1 20.5 14.5"></path></svg>
        Lokal gespeichert
      </button>
      <button type="button" aria-label="Dunkles Design" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: transparent; color: #26223A; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"></path></svg>
      </button>
      <button type="button" aria-label="Exportieren oder teilen" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: transparent; color: #26223A; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"></path><path d="M8 8l4-4 4 4"></path><path d="M5 13v6h14v-6"></path></svg>
      </button>
    </header>

    <div style="flex: 1; position: relative; overflow: hidden; background-color: #FFFEFB; background-image: radial-gradient(#D9D2C3 1.3px, transparent 1.3px); background-size: 26px 26px">
      <svg viewBox="0 0 700 460" width="700" height="460" role="img" aria-label="Skizze: Klotz auf einer schiefen Ebene mit Gewichtskraft, Normalkraft und Hangabtriebskraft" style="position: absolute; left: 40px; top: 92px">
        <path d="M30 400 L610 400 L610 150 Z" fill="none" stroke="#26223A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M470 217 L536 179 L575 246 L509 284 Z" fill="#EDE6F8" stroke="#6D4AB0" stroke-width="3.2" stroke-linejoin="round"></path>
        <path d="M522 232 L522 360" stroke="#B4570F" stroke-width="3.4" stroke-linecap="round" fill="none"></path>
        <path d="M509 342 L522 365 L535 342" stroke="#B4570F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
        <path d="M522 232 L484 152" stroke="#2A6AB0" stroke-width="3.4" stroke-linecap="round" fill="none"></path>
        <path d="M480 172 L482 148 L505 154" stroke="#2A6AB0" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
        <path d="M522 232 L430 281" stroke="#1B7568" stroke-width="3.4" stroke-linecap="round" fill="none"></path>
        <path d="M448 258 L428 283 L455 289" stroke="#1B7568" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
        <path d="M130 400 A100 100 0 0 1 112 350" stroke="#26223A" stroke-width="2.6" fill="none" stroke-linecap="round"></path>
        <text x="148" y="378" font-family="Caveat, cursive" font-size="34" font-weight="700" fill="#26223A">α</text>
        <text x="540" y="372" font-family="Caveat, cursive" font-size="34" font-weight="700" fill="#B4570F">F_G = m · g</text>
        <text x="418" y="132" font-family="Caveat, cursive" font-size="34" font-weight="700" fill="#2A6AB0">F_N</text>
        <text x="340" y="310" font-family="Caveat, cursive" font-size="34" font-weight="700" fill="#1B7568">F_H</text>
      </svg>
      <p style="position: absolute; left: 60px; top: 568px; margin: 0; font-family: 'Caveat', cursive; font-weight: 700; font-size: 30px; color: #26223A; max-width: 420px; line-height: 1.15">F_H = m · g · sin α<br>F_N = m · g · cos α</p>

      <!-- Zoom -->
      <div style="position: absolute; right: 20px; top: 16px; display: flex; align-items: center; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E6DFD0; padding: 0 4px">
        <button type="button" aria-label="Verkleinern" style="width: 44px; height: 44px; border: none; background: transparent; color: #26223A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
        <span style="font-size: 13px; font-weight: 500; min-width: 44px; text-align: center; color: #26223A">100 %</span>
        <button type="button" aria-label="Vergrößern" style="width: 44px; height: 44px; border: none; background: transparent; color: #26223A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>

      <!-- Werkzeugleiste -->
      <div role="toolbar" aria-label="Zeichenwerkzeuge" style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 6px 8px; background: #FFFFFF; border: 1px solid #E6DFD0; border-radius: 26px; box-shadow: 0 10px 28px rgba(38, 34, 58, 0.14)">
        <button type="button" aria-label="Auswählen" style="width: 48px; height: 48px; border: none; border-radius: 16px; background: transparent; color: #26223A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l14 7-6 2-2 6z"></path></svg></button>
        <button type="button" aria-label="Stift" aria-pressed="true" style="width: 48px; height: 48px; border: none; border-radius: 16px; background: #EDE6F8; color: {{accent}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1L19 8a2.1 2.1 0 0 0-3-3L5 16z"></path></svg></button>
        <button type="button" aria-label="Textmarker" style="width: 48px; height: 48px; border: none; border-radius: 16px; background: transparent; color: #26223A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4l6 6-9 9H5v-6z"></path></svg></button>
        <button type="button" aria-label="Radierer" style="width: 48px; height: 48px; border: none; border-radius: 16px; background: transparent; color: #26223A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15l9-9a2 2 0 0 1 3 0l3 3a2 2 0 0 1 0 3l-7 7H8z"></path></svg></button>
        <div style="width: 1px; height: 26px; background: #E0D8C6; margin: 0 6px"></div>
        <button type="button" aria-label="Formen" style="width: 48px; height: 48px; border: none; border-radius: 16px; background: transparent; color: #26223A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="2"></rect><circle cx="16" cy="16" r="5"></circle></svg></button>
        <button type="button" aria-label="Text" style="width: 48px; height: 48px; border: none; border-radius: 16px; background: transparent; color: #26223A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16M9 20h6"></path></svg></button>
        <button type="button" aria-label="Bild einfügen" style="width: 48px; height: 48px; border: none; border-radius: 16px; background: transparent; color: #26223A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="1.5"></circle><path d="M21 16l-5-5-8 8"></path></svg></button>
        <div style="width: 1px; height: 26px; background: #E0D8C6; margin: 0 6px"></div>
        <button type="button" aria-label="Farbe: Tinte" aria-pressed="true" style="width: 44px; height: 44px; border: none; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 26px; height: 26px; border-radius: 50%; background: #26223A; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 5px #26223A"></span></button>
        <button type="button" aria-label="Farbe: Blau" style="width: 44px; height: 44px; border: none; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 26px; height: 26px; border-radius: 50%; background: #2A6AB0"></span></button>
        <button type="button" aria-label="Farbe: Orange" style="width: 44px; height: 44px; border: none; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 26px; height: 26px; border-radius: 50%; background: #B4570F"></span></button>
        <button type="button" aria-label="Farbe: Grün" style="width: 44px; height: 44px; border: none; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 26px; height: 26px; border-radius: 50%; background: #1B7568"></span></button>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6D4AB0","options":["#6D4AB0","#2A6AB0","#1B7568","#B0386B"]},"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6D4AB0';
    const books = [
      { short: 'Ph', name: 'Physik', color: '#6D4AB0', sel: true },
      { short: 'Ma', name: 'Mathe', color: '#2A6AB0' },
      { short: 'Bi', name: 'Bio', color: '#1B7568' },
      { short: 'De', name: 'Deutsch', color: '#B4570F' },
      { short: 'En', name: 'Englisch', color: '#B0386B' }
    ].map((b) => ({
      ...b,
      bg: b.sel ? '#FFFFFF' : 'transparent',
      shadow: b.sel ? '0 2px 8px rgba(38, 34, 58, 0.12)' : 'none'
    }));
    const pages = [
      { title: 'Schiefe Ebene', date: 'Heute, 12:05', sel: true },
      { title: 'Newtonsche Axiome', date: 'Gestern' },
      { title: 'Energieerhaltung', date: 'Mo., 2. Nov.' },
      { title: 'Kreisbewegung', date: '28. Okt.' },
      { title: 'Schwingungen und Wellen', date: '21. Okt.' },
      { title: 'Optik: Brechung', date: '14. Okt.' }
    ].map((p) => ({
      ...p,
      bg: p.sel ? '#FFFFFF' : 'transparent',
      border: p.sel ? '#CDBFE6' : 'transparent',
      shadow: p.sel ? '0 2px 8px rgba(38, 34, 58, 0.08)' : 'none'
    }));
    return { accent, books, pages };
  }
}
</script>
</body>
</html>
